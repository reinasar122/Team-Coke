services:
  backend:
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DEBUG: "true"
      DB_HOST: db
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,nginx
      CORS_ALLOWED_ORIGINS: "http://localhost:${NGINX_PORT:?NGINX_PORT is required},http://127.0.0.1:${NGINX_PORT:?NGINX_PORT is required}"
      CSRF_TRUSTED_ORIGINS: "http://localhost:${NGINX_PORT:?NGINX_PORT is required},http://127.0.0.1:${NGINX_PORT:?NGINX_PORT is required}"
      CORS_ALLOW_ALL_ORIGINS: "true"
    volumes:
      - ./backend_coke_system:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
  frontend:
    build:
      context: ./frontend_coke_system
      args: {NODE_IMAGE_TAG: "${NODE_IMAGE_TAG:?NODE_IMAGE_TAG is required}"}
    image: "${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/coke-frontend:${IMAGE_TAG:?IMAGE_TAG is required}"
    command: npm start
    environment: {CHOKIDAR_USEPOLLING: "true", HOST: 0.0.0.0, PORT: 3000, REACT_APP_API_BASE: /api, PUBLIC_URL: /coke}
    volumes: [./frontend_coke_system:/app, /app/node_modules]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/coke/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  nginx:
    build: !reset null
    image: nginx:${NGINX_IMAGE_TAG:?NGINX_IMAGE_TAG is required}
    depends_on: {backend: {condition: service_healthy}, frontend: {condition: service_healthy}}
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/media:ro
      - static_data:/static:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
