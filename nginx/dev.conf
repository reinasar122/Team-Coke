upstream backend_upstream { server backend:8000; }
upstream frontend_upstream { server frontend:3000; }
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    location = / { return 301 /coke/; }
    location = /coke { return 301 /coke/; }
    location /coke/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
    location /api/ { proxy_pass http://backend_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /admin/ { proxy_pass http://backend_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /media/ { alias /media/; }
    location /static/ { alias /static/; }
    location = /nginx-health { add_header Content-Type text/plain; return 200 'ok\n'; }
}
