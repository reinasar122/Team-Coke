services:
  db:
    image: mysql:${MYSQL_IMAGE_TAG:?MYSQL_IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "export MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\"; mysqladmin ping -h localhost -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: &default-logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  backend:
    build:
      context: ./backend_coke_system
      args: {PYTHON_IMAGE_TAG: "${PYTHON_IMAGE_TAG:?PYTHON_IMAGE_TAG is required}"}
    image: "${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/coke-backend:${IMAGE_TAG:?IMAGE_TAG is required}"
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEBUG: ${DEBUG:?DEBUG is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS is required}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:?CORS_ALLOW_ALL_ORIGINS is required}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      DB_USER: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MOBILE_ORDERS_DB_NAME: ${MOBILE_ORDERS_DB_NAME:-}
      MOBILE_ORDERS_DB_HOST: ${MOBILE_ORDERS_DB_HOST:-db}
      MOBILE_ORDERS_DB_PORT: ${MOBILE_ORDERS_DB_PORT:-3306}
      MOBILE_ORDERS_DB_USER: ${MOBILE_ORDERS_DB_USER:-${MYSQL_USER}}
      MOBILE_ORDERS_DB_PASSWORD: ${MOBILE_ORDERS_DB_PASSWORD:-${MYSQL_PASSWORD}}
      MOBILE_ORDERS_MEDIA_BASE_URL: ${MOBILE_ORDERS_MEDIA_BASE_URL:-}
      EMAIL_HOST: ${EMAIL_HOST:?EMAIL_HOST is required}
      EMAIL_PORT: ${EMAIL_PORT:?EMAIL_PORT is required}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:?EMAIL_USE_TLS is required}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:?EMAIL_HOST_USER is required}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?EMAIL_HOST_PASSWORD is required}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL is required}
    depends_on: {db: {condition: service_healthy}}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check --database default >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args: {NODE_IMAGE_TAG: "${NODE_IMAGE_TAG:?NODE_IMAGE_TAG is required}", NGINX_IMAGE_TAG: "${NGINX_IMAGE_TAG:?NGINX_IMAGE_TAG is required}"}
    image: "${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/coke-nginx:${IMAGE_TAG:?IMAGE_TAG is required}"
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    depends_on: {backend: {condition: service_healthy}}
    volumes: [media_data:/media:ro, static_data:/static:ro]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/nginx-health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
volumes:
  mysql_data:
  media_data:
  static_data:
